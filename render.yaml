# Render Blueprint: API (FastAPI) + PostgreSQL
# Render -> New -> Blueprint -> select this repository.
services:
  - type: web
    name: boveda-ia-api
    runtime: python
    plan: free
    region: virginia
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: VAULT_ENV
        value: production
      - key: VAULT_STORAGE_BACKEND
        value: database
      - key: DATABASE_URL
        fromDatabase:
          name: boveda-ia-db
          property: connectionString
      # 256-bit random values generated by Render (base64). Back up VAULT_MASTER_KEY:
      # without it the stored documents cannot be decrypted.
      - key: VAULT_MASTER_KEY
        generateValue: true
      - key: VAULT_JWT_SECRET
        generateValue: true
      # Asked once when the Blueprint is created
      - key: VAULT_ADMIN_PASSWORD
        sync: false
      - key: VAULT_CORS_ORIGINS
        sync: false

databases:
  - name: boveda-ia-db
    plan: free
    region: virginia
    databaseName: boveda
    user: boveda
