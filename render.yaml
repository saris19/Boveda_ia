# Render Blueprint: API (FastAPI, folder backend/) + PostgreSQL
# Render -> New -> Blueprint -> select this repository.
services:
  - type: web
    name: boveda-ia-api
    runtime: python
    plan: free
    region: virginia
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: VAULT_ENV
        value: production
      - key: VAULT_STORAGE_BACKEND
        value: database
      - key: DATABASE_URL
        fromDatabase:
          name: boveda-ia-db
          property: connectionString
      # Random 256-bit values generated once by Render (base64).
      # Back up VAULT_MASTER_KEY: without it stored documents cannot be decrypted.
      - key: VAULT_MASTER_KEY
        generateValue: true
      - key: VAULT_JWT_SECRET
        generateValue: true
      # Initial password of the "admin" user. Read it in Render -> boveda-ia-api -> Environment.
      - key: VAULT_ADMIN_PASSWORD
        generateValue: true
      # Frontend origins allowed to call the API.
      # The regex only accepts preview deployments of YOUR Vercel team (others cannot register that suffix).
      - key: VAULT_CORS_ORIGINS
        value: https://boveda-ia.vercel.app
      - key: VAULT_CORS_ORIGIN_REGEX
        value: https://boveda-ia-[a-z0-9-]+-saray-lucia-noguera-cueltans-projects\.vercel\.app

databases:
  - name: boveda-ia-db
    plan: free
    region: virginia
    databaseName: boveda
    user: boveda
